name: Android Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
        echo "BASA_GITHUB_REPO=sengodisachinbb-glitch/BASA2.0" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > basa-release.jks
          {
            echo "storeFile=basa-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        else
          keytool -genkeypair -v -keystore basa-release.jks -alias basa -keyalg RSA -keysize 2048 -validity 10000 -storepass basapassword -keypass basapassword -dname "CN=BASA, OU=BASA, O=BASA, L=Unknown, ST=Unknown, C=US"
          {
            echo "storeFile=basa-release.jks"
            echo "storePassword=basapassword"
            echo "keyAlias=basa"
            echo "keyPassword=basapassword"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: basa-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: basa-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.3' }}
        name: BASA v1.8.3
        body: |
          ### BASA 2.0 (v1.8.3)
          - Promoted "RustBucket - ANNA NAGAR FIGURES" as #1 recommended track and top search result
          - Real-time typeahead and suggestion ranking for Anna Nagar Figures
          - Updated brand logo and color palette
        files: |
          app/build/outputs/apk/prod/release/*.apk
          wearos/build/outputs/apk/prod/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
